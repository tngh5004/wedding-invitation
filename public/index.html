<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김수호 ♥ 홍소연의 모바일 청첩장</title>
<meta name="description" content="2026년 12월 19일 토요일 낮 12시, 경기교총웨딩하우스">
<!-- 카카오톡 등 메신저 링크 미리보기(OG) — 크롤러는 JS를 실행하지 않으므로 정적으로 선언 -->
<meta property="og:type" content="website">
<meta property="og:title" content="김수호 ♥ 홍소연의 모바일 청첩장">
<meta property="og:description" content="2026년 12월 19일 토요일 낮 12시, 경기교총웨딩하우스">
<meta property="og:image" content="https://tngh5004.github.io/wedding-invitation/assets/images/01.jpg">
<meta property="og:url" content="https://tngh5004.github.io/wedding-invitation/">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
<!-- 커버(LCP) 이미지·문구를 JS 실행 전에 미리 다운로드 -->
<link rel="preload" as="image" href="assets/images/01.jpg" fetchpriority="high">
<link rel="preload" as="image" href="assets/images/cover-text.svg">
</head>
<body>
<div class="frame">

  <!-- 1. 커버 -->
  <section class="cover">
    <img src="" alt="웨딩 대표 사진" fetchpriority="high">
    <div class="cover-text">
      <!-- 웹폰트 다운로드 전에도 손글씨체로 보이도록 텍스트를 이미지화 (scripts/generate-cover-text.py) -->
      <img class="cover-text-img" src="assets/images/cover-text.svg" fetchpriority="high"
           alt="김수호 ♥ 홍소연의 결혼식에 초대합니다 — 2026. 12. 19 (토) 정오, 경기교총웨딩하우스">
    </div>
  </section>

  <!-- 2. 인사말 -->
  <section class="fade-in">
    <div class="section-label">INVITATION</div>
    <h2 class="section-title greeting-title"></h2>
    <p class="greeting-body"></p>
    <div class="parents-line">
      <div class="parents-groom"></div>
      <div class="parents-bride"></div>
    </div>
  </section>

  <!-- 3. D-day & 캘린더 -->
  <section class="fade-in">
    <div class="section-label">SAVE THE DATE</div>
    <h2 class="section-title">예식 일시</h2>
    <div class="calendar"></div>
    <div class="dday-wrap"></div>
  </section>

  <!-- 4. 갤러리 -->
  <section class="fade-in">
    <div class="section-label">GALLERY</div>
    <div class="gallery-carousel">
      <div class="gallery-main"><img src="" alt="" draggable="false"></div>
      <div class="gallery-strip"><div class="gallery-track"></div></div>
      <div class="gallery-hint">
        <button class="gh-side gh-prev" aria-label="이전 사진"><span class="gh-arrow">‹</span><span class="gh-line"></span></button>
        <button class="gh-side gh-next" aria-label="다음 사진"><span class="gh-line"></span><span class="gh-arrow">›</span></button>
      </div>
    </div>
  </section>

  <!-- 5. 동영상 -->
  <section class="video-section fade-in">
    <div class="section-label">VIDEO</div>
    <h2 class="section-title">웨딩 영상</h2>
    <div class="video-wrap">
      <video controls preload="metadata" playsinline muted></video>
    </div>
  </section>

  <!-- 6. 오시는 길 요약 -->
  <section class="fade-in">
    <div class="section-label">LOCATION</div>
    <h2 class="section-title">오시는 길</h2>
    <div class="venue-info">
      <div class="venue-name"></div>
      <div class="venue-addr"></div>
      <div class="venue-tel"><a href=""></a></div>
    </div>
    <div class="map-sketch"><img src="" alt="약도" loading="lazy"></div>
    <div class="map-links"></div>
    <ul class="transport-list"></ul>
    <p class="transport-note">대중교통 이용 시 상세 안내를 참고해주세요</p>
    <a class="more-link" href="location.html">오시는 길 상세 안내 →</a>
  </section>

  <!-- 7. 예식 안내/공지 -->
  <section class="fade-in">
    <div class="section-label">INFORMATION</div>
    <h2 class="section-title">예식 안내</h2>
    <ul class="notice-list"></ul>
  </section>

  <!-- 8. 마음 전하실 곳 -->
  <section class="fade-in">
    <div class="section-label">THANKS TO</div>
    <h2 class="section-title">마음 전하실 곳</h2>
    <div class="accounts-wrap"></div>
  </section>

  <!-- 10. 방명록 -->
  <section class="fade-in">
    <div class="section-label">GUESTBOOK</div>
    <h2 class="section-title">방명록</h2>
    <form id="gb-form" class="form-card" autocomplete="off">
      <div class="form-row">
        <label for="gb-name">성함</label>
        <input type="text" id="gb-name" name="name" maxlength="20" required placeholder="성함을 입력해주세요">
      </div>
      <div class="form-row">
        <label for="gb-message">축하 메시지</label>
        <textarea id="gb-message" name="message" maxlength="500" required placeholder="따뜻한 축하의 말을 남겨주세요"></textarea>
      </div>
      <div class="hp-field">
        <label for="gb-website">홈페이지</label>
        <input type="text" id="gb-website" name="website" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="submit-btn">메시지 남기기</button>
      <div class="form-msg"></div>
    </form>
    <div class="gb-list"></div>
    <button class="gb-more" style="display:none">더 보기</button>
  </section>

  <!-- 11. 엔딩 -->
  <section class="ending fade-in">
    <img src="" alt="엔딩 사진" loading="lazy">
    <p class="ending-msg"></p>
  </section>

  <div class="footer"></div>
</div>

<script src="js/config-loader.js"></script>
<script src="js/countdown.js"></script>
<script src="js/gallery.js"></script>
<script src="js/map.js"></script>
<script src="js/guestbook.js"></script>
<script src="js/main.js"></script>
</body>
</html>
